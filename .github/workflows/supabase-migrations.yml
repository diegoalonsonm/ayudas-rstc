name: Migraciones Supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-migrations.yml"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [dev, main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-local:
    name: Validar migraciones (local)
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Arrancar Postgres local y aplicar migraciones
        run: supabase db start

      - name: Listar historial local
        run: supabase migration list --local

  deploy-development:
    name: Aplicar migraciones en desarrollo
    if: >
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.base_ref == 'dev'
    runs-on: ubuntu-latest
    environment: development
    concurrency:
      group: supabase-development-migrations
      cancel-in-progress: false
    env:
      DEV_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Comprobar destino de desarrollo
        id: dest
        run: |
          if [ -z "$DEV_DATABASE_URL" ]; then
            echo "Falta el secreto DEV_DATABASE_URL (postgresql://usuario:clave@HOST:PUERTO/postgres)."
            exit 1
          fi
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse
          u = urlparse(os.environ["DEV_DATABASE_URL"])
          host = (u.hostname or "").lower()
          port = u.port or 5432
          print(f"Destino (sin secretos): host={host} port={port} db={(u.path or '/').lstrip('/') or 'postgres'}")
          if host in ("127.0.0.1", "localhost", "::1"):
              raise SystemExit(
                  "DEV_DATABASE_URL apunta a localhost. Usa la IP Tailscale del servidor "
                  "(100.x) y el puerto de Postgres (5432), no 127.0.0.1 ni :8000/rest."
              )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"host={host}\n")
          PY

      - name: Comprobar secretos de Tailscale
        run: |
          if [ -z "${{ secrets.TS_OAUTH_CLIENT_ID }}" ] || [ -z "${{ secrets.TS_OAUTH_SECRET }}" ]; then
            echo "Faltan TS_OAUTH_CLIENT_ID y/o TS_OAUTH_SECRET en el environment development."
            exit 1
          fi

      - name: Conectar a Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ steps.dest.outputs.host }}

      - name: Vista previa de migraciones pendientes
        run: supabase db push --db-url "$DEV_DATABASE_URL" --dry-run

      - name: Aplicar migraciones pendientes
        run: supabase db push --db-url "$DEV_DATABASE_URL"

      - name: Listar historial remoto
        run: supabase migration list --db-url "$DEV_DATABASE_URL"

  deploy-production:
    name: Aplicar migraciones en producción
    needs: validate-local
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: supabase-production-migrations
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.PRODUCTION_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Comprobar secretos de producción
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "Faltan secretos: SUPABASE_ACCESS_TOKEN, PRODUCTION_PROJECT_ID y/o PRODUCTION_DB_PASSWORD."
            exit 1
          fi

      - name: Enlazar proyecto de producción
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Vista previa de migraciones pendientes
        run: supabase db push --dry-run

      - name: Aplicar migraciones pendientes
        run: supabase db push

      - name: Listar historial remoto
        run: supabase migration list
