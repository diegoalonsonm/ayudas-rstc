# Configuración local de Supabase (CLI).
# El dominio vive en el schema `ayudas_rstc` (no en `public`).
# Ajuste `project_id` y `db.major_version` para que coincidan con el proyecto remoto.

project_id = "ayudas-rstc"

[api]
enabled = true
port = 54321
schemas = ["ayudas_rstc", "storage", "graphql_public"]
extra_search_path = ["ayudas_rstc", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
